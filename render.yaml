services:
  - type: web
    name: smartnagar
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_CITIZEN_PASSWORD
        sync: false
      - key: DEMO_ROADS_PASSWORD
        sync: false
      - key: DEMO_SANITATION_PASSWORD
        sync: false
      - key: DEMO_ELECTRICITY_PASSWORD
        sync: false
      - key: DEMO_WATER_PASSWORD
        sync: false
      - key: DEMO_NIGAM_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
